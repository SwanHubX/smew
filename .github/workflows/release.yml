name: Release

# 在 GitHub 上发布 Release 时发到 npm。认证走 OIDC 信任发布，npm 侧的 Trusted Publisher
# 绑定的是本文件名，改名会让发布直接失败
on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write # 用 OIDC 换短期发布令牌，仓库里不存任何 npm token

jobs:
  publish:
    # 勾了预发布标签的 Release 不进正式版本
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 发布构建不复用依赖缓存，避免旧产物混进 tarball
      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      # wasm-pack 版本决定 wasm-opt 的下载版本，与本地保持一致才能产出同样的 wasm
      - name: Install wasm-pack
        run: |
          curl -sSfL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/
          wasm-pack --version

      - name: Install dependencies
        run: npm ci

      # Release 的标签与 package.json 版本不一致时直接失败，避免把错误版本发出去
      - name: Verify release tag matches package version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${TAG_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release 标签 ${TAG_NAME} 与 package.json 的版本 ${version} 不一致" >&2
            exit 1
          fi

      - name: Type-check
        run: npx tsc --build tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      # 发布是最后一道门：tag 可以指向未经 CI 的提交，这里按 test.yml 的同一套标准复核 Rust
      - name: Format check
        run: cargo fmt --check

      - name: Clippy (wasm32 target)
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      # prepublishOnly 会重建 wasm、声明与入口，tarball 内容来自当前 Release 指向的提交
      - name: Publish to npm
        run: npm publish
